name: Status checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Check Bash syntax
        run: |
          bash -n entrypoint.sh
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts test -type f -name '*.sh' -print0)

      - name: Run ShellCheck
        run: shellcheck -x --severity=warning entrypoint.sh

  smoke:
    name: Lifecycle smoke tests
    runs-on: ubuntu-latest
    needs: shell
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run smoke tests
        run: |
          for test_script in test/*-smoke.sh; do
            echo "==> ${test_script}"
            bash "${test_script}"
          done

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build latest target
        run: |
          docker build \
            --pull \
            --target bedrock-latest \
            --tag minecraft-bedrock-server:ci-latest \
            .

      - name: Build stable target
        run: |
          docker build \
            --target bedrock-stable \
            --build-arg BDS_STABLE_VERSION=1.21.130.4 \
            --tag minecraft-bedrock-server:ci-stable \
            .

  status:
    name: Status checks
    runs-on: ubuntu-latest
    needs:
      - shell
      - smoke
      - docker
    if: always()
    steps:
      - name: Verify required jobs
        run: |
          if [[ "${{ needs.shell.result }}" != "success" ]]; then
            echo "Shell checks failed or did not complete successfully"
            exit 1
          fi
          if [[ "${{ needs.smoke.result }}" != "success" ]]; then
            echo "Lifecycle smoke tests failed or did not complete successfully"
            exit 1
          fi
          if [[ "${{ needs.docker.result }}" != "success" ]]; then
            echo "Docker build failed or did not complete successfully"
            exit 1
          fi
          echo "All required status checks passed"
